name: Compile ChinesePoint X4 Pro Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

# This fork deliberately has one supported target. Do not add upstream board
# environments here: a successful build for a different Xteink is not a
# ChinesePoint release candidate and can be dangerous when copied to an SD.
jobs:
  build-release-candidate:
    if: startsWith(github.ref_name, 'release/chinesepoint-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python -m pip install "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: chinesepoint-x4pro-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: chinesepoint-x4pro-${{ runner.os }}-

      - name: Build X4 Pro application image only
        run: pio run -e chinesepoint_x4pro -j1

      - name: Verify target and application artifact
        run: |
          python tools/chinesepoint/verify_artifact.py \
            --firmware .pio/build/chinesepoint_x4pro/firmware.bin \
            --environment chinesepoint_x4pro \
            --expected-version ChinesePoint-v0.6-x4pro \
            --manifest qa-artifacts/chinesepoint-x4pro-artifact.json

      - name: Upload X4 Pro candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: ChinesePoint-X4-Pro-RC-${{ github.sha }}
          path: |
            .pio/build/chinesepoint_x4pro/firmware.bin
            .pio/build/chinesepoint_x4pro/firmware.elf
            .pio/build/chinesepoint_x4pro/firmware.map
            qa-artifacts/chinesepoint-x4pro-artifact.json
