name: X4 Pro bug report
description: Report a reproducible fault in an already assigned ChinesePoint X4 Pro test candidate.
title: "[x4pro] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for Xteink X4 Pro and an explicitly assigned hardware-test candidate. Do not flash a blocked or simulator artifact to create a report. For panel, boot, recovery, or orientation results, use the dedicated hardware-test form.
  - type: input
    id: candidate
    attributes:
      label: Candidate commit and SHA-256
      placeholder: "commit: ...; sha256: ..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and observed result
      placeholder: |
        1. ...
        2. ...
        Expected: ...
        Observed: ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or photos
      description: Attach relevant logs or photos. Remove personal data and private LAN tokens.